<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Tributes — Dr. Vincent Magubo Nyagucha</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <div class="admin-brand-mark">VN</div>
        <div class="admin-brand-text">
          <div class="admin-brand-name">Vincent Nyagucha</div>
          <div class="admin-brand-sub">Family admin</div>
        </div>
      </div>
      <nav class="admin-menu">
        <a href="index.html" class="active">Tributes</a>
        <a href="site.html">Site &amp; hero</a>
        <a href="announcements.html">Announcements</a>
        <a href="gallery.html">Gallery</a>
        <a href="biography.html">Biography</a>
      </nav>
      <div class="admin-sidebar-foot">
        <a href="../index.html" class="admin-side-link" target="_blank" rel="noopener">↗ View live site</a>
        <div class="admin-user">Signed in as<strong data-admin-email>…</strong></div>
      </div>
    </aside>
    <div class="admin-overlay"></div>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="admin-menu-toggle" aria-label="Menu">☰</button>
        <h1>Tributes</h1>
        <span class="admin-topbar-sub">Approve messages before they appear publicly</span>
      </header>

      <div class="admin-content">
        <div class="admin-tabs" role="tablist">
          <button class="admin-tab active" data-status="pending" type="button">Pending <span class="tab-count" id="count-pending">0</span></button>
          <button class="admin-tab" data-status="approved" type="button">Approved <span class="tab-count" id="count-approved">0</span></button>
          <button class="admin-tab" data-status="rejected" type="button">Rejected <span class="tab-count" id="count-rejected">0</span></button>
        </div>

        <div id="admin-list" class="admin-list">
          <p class="muted-note">Loading…</p>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-root"></div>
  <script src="../js/admin-common.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
