<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Dr. Vincent Magubo Nyagucha</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="brand">
        <div class="brand-mark">VN</div>
        <div class="brand-text">
          <div class="brand-name">Dr. Vincent Nyagucha</div>
          <div class="brand-role">Family admin</div>
        </div>
      </a>
      <nav aria-label="Main">
        <ul class="site-nav">
          <li><a href="../index.html">View site</a></li>
          <li><a href="../tributes.html">Tributes</a></li>
          <li><a href="../guestbook.html">Guestbook</a></li>
          <li><a href="index.html" class="active">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="page-head">
    <div class="page-head-inner">
      <h1>Family admin</h1>
      <p id="admin-who">Signed in</p>
    </div>
  </div>

  <main class="section">
    <div class="container">
      <div class="admin-tabs" role="tablist">
        <button class="admin-tab active" data-status="pending" type="button">Pending <span class="tab-count" id="count-pending">0</span></button>
        <button class="admin-tab" data-status="approved" type="button">Approved <span class="tab-count" id="count-approved">0</span></button>
        <button class="admin-tab" data-status="rejected" type="button">Rejected <span class="tab-count" id="count-rejected">0</span></button>
      </div>

      <div id="admin-msg" class="form-msg" hidden></div>
      <div id="admin-list" class="admin-list">
        <p class="form-hint">Loading…</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bar">In loving memory of Dr. Vincent Magubo Nyagucha</div>
    <div class="footer-credit"><p>Made with love by Caleb Machoka</p></div>
  </footer>

  <script src="../js/admin.js"></script>
</body>
</html>
