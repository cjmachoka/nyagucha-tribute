<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Biography — Dr. Vincent Magubo Nyagucha</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="brand">
        <div class="brand-mark">VN</div>
        <div class="brand-text">
          <div class="brand-name">Dr. Vincent Nyagucha</div>
          <div class="brand-role">Family admin</div>
        </div>
      </a>
      <nav aria-label="Main">
        <ul class="site-nav">
          <li><a href="../index.html">View site</a></li>
          <li><a href="index.html" class="active">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="page-head">
    <div class="page-head-inner">
      <h1>Biography</h1>
      <p>Life chapters and chapter photos</p>
    </div>
  </div>

  <nav class="admin-subnav">
    <div class="admin-subnav-inner">
      <a href="index.html">Tributes</a>
      <a href="site.html">Site</a>
      <a href="announcements.html">Announcements</a>
      <a href="gallery.html">Gallery</a>
      <a href="biography.html" class="active">Biography</a>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <div id="admin-msg" class="form-msg" hidden></div>

      <section class="admin-block">
        <h2>Add a chapter</h2>
        <form id="chapter-form">
          <div class="form-group">
            <label for="ch-title">Title</label>
            <input type="text" id="ch-title" name="title" required />
          </div>
          <div class="form-group">
            <label for="ch-body">Body</label>
            <textarea id="ch-body" name="body" rows="5" required placeholder="Paragraphs separated by a blank line."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Add chapter</button>
        </form>
      </section>

      <section class="admin-block">
        <h2>Chapters</h2>
        <div id="chapter-list">
          <p class="form-hint">Loading…</p>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bar">In loving memory of Dr. Vincent Magubo Nyagucha</div>
    <div class="footer-credit"><p>Made with love by Caleb Machoka</p></div>
  </footer>

  <script src="../js/admin-common.js"></script>
  <script src="../js/admin-biography.js"></script>
</body>
</html>
