<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Announcements — Dr. Vincent Magubo Nyagucha</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <div class="admin-brand-mark">VN</div>
        <div class="admin-brand-text">
          <div class="admin-brand-name">Vincent Nyagucha</div>
          <div class="admin-brand-sub">Family admin</div>
        </div>
      </div>
      <nav class="admin-menu">
        <a href="index.html">Tributes</a>
        <a href="site.html">Site &amp; hero</a>
        <a href="announcements.html" class="active">Announcements</a>
        <a href="gallery.html">Gallery</a>
        <a href="biography.html">Biography</a>
      </nav>
      <div class="admin-sidebar-foot">
        <a href="../index.html" class="admin-side-link" target="_blank" rel="noopener">↗ View live site</a>
        <div class="admin-user">Signed in as<strong data-admin-email>…</strong></div>
      </div>
    </aside>
    <div class="admin-overlay"></div>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="admin-menu-toggle" aria-label="Menu">☰</button>
        <h1>Announcements</h1>
        <span class="admin-topbar-sub">Service details, condolence notes, family news</span>
      </header>

      <div class="admin-content">
        <section class="card">
          <h2 class="card-title">Add an announcement</h2>
          <form id="ann-form">
            <div class="form-group">
              <label for="ann-title">Title</label>
              <input type="text" id="ann-title" name="title" required />
            </div>
            <div class="form-group">
              <label for="ann-kind">Type</label>
              <select id="ann-kind" name="kind">
                <option value="family-notice">Family notice</option>
                <option value="funeral">Funeral</option>
                <option value="memorial">Memorial</option>
                <option value="condolence">Condolence</option>
                <option value="news">News</option>
                <option value="general" selected>General</option>
              </select>
            </div>
            <div class="form-group">
              <label for="ann-body">Body</label>
              <textarea id="ann-body" name="body" rows="4" required></textarea>
            </div>
            <div class="form-group">
              <label for="ann-link">Link (optional)</label>
              <input type="url" id="ann-link" name="link_url" placeholder="https://" />
            </div>
            <div class="form-group">
              <label><input type="checkbox" id="ann-pinned" name="pinned" /> Pin to top</label>
            </div>
            <button type="submit" class="btn btn-primary">Add announcement</button>
          </form>
        </section>

        <section class="card">
          <h2 class="card-title">Existing announcements</h2>
          <div id="ann-list" class="admin-list">
            <p class="muted-note">Loading…</p>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="toast-root"></div>
  <script src="../js/admin-common.js"></script>
  <script src="../js/admin-announcements.js"></script>
</body>
</html>
